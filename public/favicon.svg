<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7F7F8"/>
    </linearGradient>
    <linearGradient id="orangeDot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9F0A"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </linearGradient>
    <linearGradient id="blueDot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#0062D2"/>
    </linearGradient>
    <linearGradient id="redDot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF453A"/>
      <stop offset="100%" stop-color="#D7261E"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="none" stroke="rgba(0,0,0,0.07)" stroke-width="2"/>

  <!-- Row 1: Orange Reminder -->
  <circle cx="144" cy="160" r="26" fill="url(#orangeDot)" filter="url(#subtleShadow)"/>
  <rect x="196" y="147" width="200" height="26" rx="13" fill="#D1D1D6"/>

  <!-- Row 2: Blue Reminder -->
  <circle cx="144" cy="256" r="26" fill="url(#blueDot)" filter="url(#subtleShadow)"/>
  <rect x="196" y="243" width="160" height="26" rx="13" fill="#D1D1D6"/>

  <!-- Row 3: Red Reminder -->
  <circle cx="144" cy="352" r="26" fill="url(#redDot)" filter="url(#subtleShadow)"/>
  <rect x="196" y="339" width="120" height="26" rx="13" fill="#D1D1D6"/>
</svg>
