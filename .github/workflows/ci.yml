name: CI & Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & E2E Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://neondb_owner:npg_2gljaqFKrIy5@ep-shiny-recipe-aba2p06b-pooler.eu-west-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'super_secret_jwt_key_for_recordatorios' }}
      PORT: 3001

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck & Build Frontend
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Playwright Tests
        run: npx playwright test tests/e2e.spec.ts

      - name: Upload Test Report Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
