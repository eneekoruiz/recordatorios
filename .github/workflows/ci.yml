name: CI & Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_LFS_SKIP_SMUDGE: '1'

jobs:
  test:
    name: Build & E2E Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: recordatorios_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: 'true'
      # Siempre la base de datos efímera del job: los tests crean usuarios y nunca deben tocar producción.
      DATABASE_URL: 'postgresql://test_user:test_password@localhost:5432/recordatorios_test?sslmode=disable'
      JWT_SECRET: 'ci-only-secret-not-used-anywhere-else'
      PORT: 3001

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push Database Schema
        run: npx prisma db push --skip-generate

      - name: Lint
        run: npm run lint

      - name: Unit tests (API, sincronización, NLP)
        run: npm test

      - name: Typecheck & Build Frontend
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Playwright Tests (suite completa)
        run: npx playwright test

      - name: Upload Test Report Artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
